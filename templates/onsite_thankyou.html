<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta http-equiv="refresh" content="5;url={{ url_for('onsite_feedback', id=request.view_args['id']) }}">
    <title>Feedback</title>
</head>
<body>
    <div class="min-h-screen flex flex-col items-center justify-center px-4 pb-16 text-center">
        <p class="text-2xl sm:text-4xl md:text-5xl">
            Thank you for your feedback.
        </p>

        <p class="text-gray-400 mt-6 sm:mt-10 text-lg sm:text-2xl md:text-3xl">
            You rated your experience as <span class="text-gray-500 font-medium">{{ feedback }}</span>.
        </p>
    </div>

    <footer class="fixed bottom-2 w-full flex justify-center px-4">
        <p class="text-gray-400 text-sm sm:text-base text-center">
            This form is powered by <span class="text-gray-500 font-medium">Votely</span>
        </p>
    </footer>
</body>
</html>
