{% extends "layout.html" %}

{% block title %}
    Votely Login
{% endblock %}
{% block main %}
    <form action="/register" class="flex flex-col gap-3 items-center mt-[20vh]" method="post">
        <input name="username" type="text" class="rounded p-2 border" placeholder="Username"  autocomplete="off" required>
        <input name="email" type="email" class="rounded p-2 border" placeholder="Email" required>
        <input name="password" type="password" class="rounded p-2 border" placeholder="Password" required>
        <input name="passwordconfirmation" type="password" class="rounded p-2 border" placeholder="Password Again" required>
        <input type="submit" class="rounded p-2 text-gray-900 bg-green-400" value="Register" />
    </form>
    <p class="mt-8 text-sm text-gray-400 flex justify-center">Already have an account? <a href="/login" class="ml-1 underline">Login</a></p>
{% endblock %}
