<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Feedback</title>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="min-h-screen flex items-center justify-center px-4">
            <form method="post" class="flex flex-col sm:flex-row gap-12 sm:gap-24 md:gap-32 items-center">
                <button type="submit" name="rating" value="3">
                    <img src="{{ url_for('static', filename='good.png') }}"
                        alt="Good"
                        class="w-40 sm:w-56 md:w-64">
                </button>

                <button type="submit" name="rating" value="2">
                    <img src="{{ url_for('static', filename='medium.png') }}"
                        alt="Medium"
                        class="w-40 sm:w-56 md:w-64">
                </button>

                <button type="submit" name="rating" value="1">
                    <img src="{{ url_for('static', filename='bad.png') }}"
                        alt="Bad"
                        class="w-40 sm:w-56 md:w-64">
                </button>
            </form>
        </div>
    </div>
    <footer class="fixed bottom-2 w-full flex justify-center">
        <p class="text-gray-400">
            This form is powered by <span class="text-gray-500 font-medium">Votely</span>
        </p>
    </footer>
</body>
</html>
