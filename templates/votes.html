{% extends "layout.html" %}

{% block title %}
    Votes
{% endblock %}
{% block main %}
    <div class="mt-10 sm:mt-12 max-w-6xl mx-auto px-2 sm:px-0">
        <div class="flex justify-end mb-2 mr-4">
            <a href="/dashboard/download_votes"
               class="text-white underline">
                Download
            </a>
        </div>

        <div class="border border-gray-700 shadow-lg p-4 rounded-lg bg-gray-800 text-white">
            <table class="table-fixed w-full">
                <thead>
                    <tr>
                        <th>Rating</th>
                        <th>Comment</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for vote in votes %}
                        <tr>
                            <td class="text-center">{{ vote[0] }}</td>
                            <td class="text-center truncate">{{ vote[1] }}</td>
                            <td class="text-center">{{ vote[2] }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
